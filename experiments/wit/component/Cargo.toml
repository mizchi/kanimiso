[package]
name = "wit-component"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib"]
[features]
default = []
std = []
[dependencies]
wit-bindgen = {version = "=0.58.0", default-features = false, features = ["macros", "async", "async-spawn"]}
kanimiso-allocator = {path = "../../../crates/kanimiso-allocator", default-features = false}
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
