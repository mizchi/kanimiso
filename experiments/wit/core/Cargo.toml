[package]
name = "wit-core"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib"]
[features]
default = []
std = ["taraba/std"]
[dependencies]
wit-bindgen = {version = "=0.58.0", default-features = false, features = ["macros"]}
taraba = {path = "../../../crates/taraba", default-features = false}
taraba-allocator = {path = "../../../crates/taraba-allocator", default-features = false}
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
