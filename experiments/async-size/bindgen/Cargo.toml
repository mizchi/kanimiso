[package]
name = "size-bindgen"
version = "0.0.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[features]
default = []
std = ["wasm-bindgen/std", "js-sys/std", "wasm-bindgen-futures/std", "futures-util?/std"]
async-workload = []
embassy = ["dep:embassy-executor", "dep:critical-section"]
tokio = ["dep:tokio"]
async-executor = ["dep:async-executor"]
async-std = ["dep:async-std"]
futures-unordered = ["dep:futures-util"]
wee = ["dep:wee_alloc"]
[dependencies]
wasm-bindgen = {version = "=0.2.129", default-features = false}
wasm-bindgen-futures = {version = "=0.4.79", default-features = false}
js-sys = {version = "=0.3.106", default-features = false}
embassy-executor = {version = "=0.10.0", default-features = false, features = ["platform-wasm", "executor-thread"], optional = true}
critical-section = {version = "=1.2.0", features = ["std"], optional = true}
tokio = {version = "=1.53.3", default-features = false, features = ["rt"], optional = true}
async-executor = {version = "=1.14.0", optional = true}
async-std = {version = "=1.13.2", features = ["unstable"], optional = true}
futures-util = {version = "=0.3.34", default-features = false, features = ["alloc", "async-await"], optional = true}
taraba-allocator = {path = "../../../crates/taraba-allocator", default-features = false}
wee_alloc = {version = "=0.4.5", default-features = false, optional = true}
