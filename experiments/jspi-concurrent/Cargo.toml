[package]
name = "jspi-concurrent-experiment"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib"]
[features]
default = []
std = []
probes = []
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = {version = "=0.58.0", default-features = false, features = ["macros"]}
taraba-allocator = {path = "../../crates/taraba-allocator", default-features = false}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
walrus = "=0.27.2"
[dev-dependencies]
wat = "=1.252.0"
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
