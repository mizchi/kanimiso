[package]
name = "taraba-cli"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Build Rust/Wasm applications and matching JS glue for taraba"
repository = "https://github.com/mizchi/taraba"
readme = "README.md"
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
default-run = "taraba"

[[bin]]
name = "taraba"
path = "src/main.rs"

[dependencies]
walrus = "=0.27.2"
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
tempfile = "=3.27.0"
wit-parser = "=0.251.0"
notify = "=8.2.0"
ctrlc = { version = "=3.5.2", features = ["termination"] }
wasmparser = "=0.252.0"
twiggy-ir = "=0.8.0"
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
semver = "=1.0.28"

[dev-dependencies]
wat = "=1.252.0"
