[package]
name = "taraba"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Promise-first single-agent Rust/Wasm runtime"
repository = "https://github.com/mizchi/taraba"
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[lib]
doctest = false

[features]
default = []
std = []
# Include detailed Rust panic text in an optimized diagnostic build.
panic-details = []
# Internal fixture diagnostics; not an application API.
test-api = []
