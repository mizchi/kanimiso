[package]
name = "taraba"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Promise-first single-agent Rust/Wasm runtime"
repository = "https://github.com/mizchi/taraba"
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[lib]
doctest = false

[features]
default = []
std = []
