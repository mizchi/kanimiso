[package]
name = "kanimiso-allocator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
description = "Small single-agent wasm32 allocator for JavaScript hosts"
repository = "https://github.com/mizchi/kanimiso"
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE", "UPSTREAM.json"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[lib]
doctest = false

[features]
default = ["size_classes"]
size_classes = []
extra_assertions = []
instrumentation = []

[dependencies]
memory_units = "=0.4.0"
