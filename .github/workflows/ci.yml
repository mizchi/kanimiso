name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - run: just msrv-check
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: just setup
      - run: just check
      - run: just check-jspi-concurrent
      - run: just check-async-size
      - run: just check-allocator
      - run: just package-check --require-clean
      - run: just modern
      - run: just stress 60
      - run: just workers --jspi-concurrent
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: |
            .cache/check.json
            .cache/jspi-check.json
            .cache/panic-reporting/check.json
            .cache/insight-check.json
            .cache/helpers/report.json
            .cache/strings/report.json
            .cache/jspi-future-experiment/check.json
            .cache/jspi-concurrent/check.json
            .cache/jspi-concurrent/failure.log
            .cache/stress.json
            .cache/package-check.json
            .cache/package-check-error.log
            .cache/library-check.json
            .cache/library-check-error.log
            .cache/runtime-abi-check.json
            .cache/runtime-abi-error.log
            .cache/resources-error.log
            .cache/guest-resources-error.log
            .cache/watch-check.json
            .cache/watch-check.log
            .cache/async-size/check.json
            .cache/async-size/failure.log
            .cache/allocator/check.json
            .cache/allocator/failure.log
            .cache/workers.json
            .cache/workers/log.txt
          include-hidden-files: true
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: just setup
      - run: pnpm exec playwright install --with-deps chrome webkit
      - run: just browser-check
      - run: just webkit-latest-check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-verification
          path: |
            .cache/browser/results*
            .cache/browser/report
            .cache/browser/latest
          include-hidden-files: true
  rich-async:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: just setup
      - run: just check-rich-async
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rich-async-verification
          path: |
            .cache/rich-async/report.json
            .cache/rich-async/failure.log
          include-hidden-files: true

  middleware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v4
      - run: just setup
      - run: just check-order-middleware
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: middleware-verification
          path: |
            .cache/order-middleware/report.json
            .cache/order-middleware/failure.log
          include-hidden-files: true
