name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@12.11.2 --activate
      - uses: extractions/setup-just@v4
      - run: just setup
      - run: just check
      - run: just check-jspi-concurrent
      - run: just package-check
      - run: just modern
      - run: just stress 60
      - run: just workers --jspi-concurrent
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: |
            .cache/check.json
            .cache/jspi-check.json
            .cache/jspi-future-experiment/check.json
            .cache/jspi-concurrent/check.json
            .cache/jspi-concurrent/failure.log
            .cache/stress.json
            .cache/package-check.json
            .cache/package-check-error.log
            .cache/library-check.json
            .cache/library-check-error.log
            .cache/workers.json
            .cache/workers/log.txt
          include-hidden-files: true
