[package]
name = "kanimiso-promise"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
std = ["jsrt/std"]
test-api = []
probes = ["test-api"]

[dependencies]
jsrt = { package = "kanimiso", path = "../../crates/kanimiso", default-features = false }
kanimiso-allocator = { version = "0.1.0", path = "../../crates/kanimiso-allocator", default-features = false }
