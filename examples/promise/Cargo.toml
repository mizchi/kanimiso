[package]
name = "taraba-promise"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
std = ["jsrt/std"]
test-api = []
probes = ["test-api", "jsrt/test-api"]

[dependencies]
jsrt = { package = "taraba", path = "../../crates/taraba", default-features = false }
taraba-allocator = { version = "0.2.1", path = "../../crates/taraba-allocator", default-features = false }
